const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.querySelector('#routes');const expanded=new Set(['cheongdam']);let day='전체';
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));document.querySelector('#saved').textContent='이 브라우저에 저장됨 · GitHub 저장 및 기기 간 동기화 안 됨';canSave=true;return true;}catch{document.querySelector('#saved').textContent='저장 실패 · 메모를 따로 복사해 보관해주세요.';canSave=false;return false;}}

function readReview(key){const item=state.reviews[key];return {scores:criteria.map((_,i)=>{const n=Number(item?.scores?.[i]);return Number.isInteger(n)&&n>=1&&n<=5?n:5;}),note:typeof item?.note==='string'?item.note:'',recorded:!!item};}
function reviewHTML(key,name){const review=readReview(key);const total=review.scores.reduce((a,b)=>a+b,0);return `<details class="bar-review" data-review="${key}" ${openReviews.has(key)?'open':''}><summary><span>평가 · 메모</span><span class="review-summary">${review.recorded?'평균 '+(total/5).toFixed(1)+' / 5':'미작성'}</span></summary><div class="review-content"><p class="review-guide">항목별 5점 만점 · 기본값 5점</p><div class="scores">${criteria.map((label,i)=>`<label class="score-row" for="score-${key}-${i}"><span>${label}</span><select id="score-${key}-${i}" data-score="${key}" data-index="${i}" aria-label="${esc(name)} ${label} 점수">${[5,4,3,2,1].map(n=>`<option value="${n}" ${review.scores[i]===n?'selected':''}>${n}점</option>`).join('')}</select></label>`).join('')}</div><p class="review-total">평균 <strong>${(total/5).toFixed(1)} / 5</strong><span>총점 ${total} / 25</span></p><label class="review-note-label" for="note-${key}">${esc(name)} 조사 메모</label><textarea id="note-${key}" data-note="${key}" placeholder="좋았던 점 · 개선점 · 적용할 점">${esc(review.note)}</textarea><div class="review-actions"><button type="button" data-save-review="${key}">평가 저장</button><span class="review-status" aria-live="polite">${review.recorded?'이 브라우저에 저장됨':'미저장 · 점수/메모 수정 시 자동 저장'}</span></div></div></details>`;}
function persistReview(key){const box=document.querySelector(`[data-review="${key}"]`);const scores=[...box.querySelectorAll('select')].map(el=>Number(el.value));state.reviews[key]={scores,note:box.querySelector('textarea').value};const saved=save();const total=scores.reduce((a,b)=>a+b,0);box.querySelector('.review-summary').textContent='평균 '+(total/5).toFixed(1)+' / 5';box.querySelector('.review-total').innerHTML=`평균 <strong>${(total/5).toFixed(1)} / 5</strong><span>총점 ${total} / 25</span>`;box.querySelector('.review-status').textContent=saved?'이 브라우저에 저장됨':'저장 실패 · 메모를 따로 복사해주세요.';}
document.addEventListener('toggle',e=>{if(e.target.matches?.('[data-review]')){const key=e.target.dataset.review;e.target.open?openReviews.add(key):openReviews.delete(key);}},true);
document.addEventListener('change',e=>{if(e.target.matches('[data-score]'))persistReview(e.target.dataset.score);});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]'))persistReview(e.target.dataset.note);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-save-review]');if(b)persistReview(b.dataset.saveReview);});

function barHTML(b,r,i){const key=r.id+'-'+i;const done=state.visited.includes(key);const query=b[0]+' '+b[2];const google='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query);const naver=b[5]?'https://map.naver.com/p/entry/place/'+b[5]:'https://map.naver.com/p/search/'+encodeURIComponent(query);return `<div class="stop ${done?'done':''}"><div class="stop-top"><div><time>${b[1]}</time><h3>${esc(b[0])}</h3></div><button class="check" data-check="${key}" aria-label="${esc(b[0])} 방문 완료" aria-pressed="${done}">${done?'✓ 방문함':'방문 체크'}</button></div><p class="address">${esc(b[2])}</p><p class="hours">${esc(b[3])}</p>${b[6]?`<p class="alert">${esc(b[6])}</p>`:''}<div class="links"><a href="${google}" target="_blank" rel="noopener noreferrer">구글맵</a><a href="${naver}" target="_blank" rel="noopener noreferrer">네이버지도</a><a href="https://www.instagram.com/barhopping_girl/reel/${b[4]}/" target="_blank" rel="noopener noreferrer">소개 콘텐츠</a></div>${reviewHTML(key,b[0])}</div>`;}
function render(){const filtered=routes.filter(r=>day==='전체'||r.days.includes(day));document.querySelector('.result').textContent=`${day==='전체'?'전체 '+filtered.length+'개 코스':day+'요일 · 세 곳 모두 영업하는 '+filtered.length+'개 코스'} · 방문 ${state.visited.length}/18`;document.querySelector('.days').innerHTML=['전체','월','화','수','목','금'].map(d=>`<button data-day="${d}" aria-pressed="${day===d}">${d==='전체'?'전체 코스':d+'요일'}</button>`).join('');const excluded=routes.filter(r=>day!=='전체'&&!r.days.includes(day));const explanation=document.querySelector('#filter-excluded');explanation.hidden=excluded.length===0;explanation.textContent=excluded.length?'휴무로 제외: '+excluded.map(r=>r.title).join(', '):'';root.innerHTML=filtered.map(r=>{const open=expanded.has(r.id);return `<article class="route" id="${r.id}"><button class="route-head" data-route="${r.id}" aria-expanded="${open}" aria-controls="body-${r.id}"><div class="route-top"><span class="index">코스 ${String(routes.indexOf(r)+1).padStart(2,'0')}</span></div><div class="route-title"><h2>${r.title}</h2><span class="toggle" aria-hidden="true">${open?'−':'+'}</span></div><div class="common-days"><span class="common-days-label">세 곳 모두 영업하는 평일</span> <strong>${r.days.join(' · ')}</strong></div><div class="route-sub">방문 일정 &nbsp; ${r.bars[0][1]}–${r.end}</div><div class="route-summary">${r.bars.map(b=>`<span>${esc(b[0])}</span>`).join(' → ')}</div></button><div class="route-body" id="body-${r.id}" ${open?'':'hidden'}><div class="focus"><b>조사 항목</b>${r.focus}</div>${r.bars.map((b,i)=>barHTML(b,r,i)).join('')}<p class="end">↳ ${r.end} 종료 예정</p></div></article>`;}).join('');}
document.addEventListener('click',e=>{const d=e.target.closest('[data-day]');if(d){day=d.dataset.day;render();document.querySelector(`[data-day="${day}"]`).focus();return;}const t=e.target.closest('[data-route]');if(t){expanded.has(t.dataset.route)?expanded.delete(t.dataset.route):expanded.add(t.dataset.route);render();document.querySelector(`[data-route="${t.dataset.route}"]`).focus({preventScroll:true});return;}const c=e.target.closest('[data-check]');if(c){const key=c.dataset.check;state.visited=state.visited.includes(key)?state.visited.filter(k=>k!==key):[...state.visited,key];save();render();document.querySelector(`[data-check="${key}"]`).focus({preventScroll:true});}});
document.querySelector('#memo').value=state.memo;document.querySelector('#memo').addEventListener('input',e=>{state.memo=e.target.value;save();});
if(!canSave){document.querySelector('#notice').hidden=false;document.querySelector('#notice').textContent='이 브라우저에서는 방문 기록을 저장하지 못할 수 있습니다.';}
render();
</script>
</body></html>
